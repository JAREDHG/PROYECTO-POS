server {
    listen 80;
    server_name localhost;
    
    # Enrutamos todo el tráfico EXCLUSIVAMENTE a la carpeta public de Laravel
    root /var/www/html/public;
    index index.php index.html index.htm;

    charset utf-8;

    # Cabeceras de Seguridad Básicas (Mitigación de ataques comunes)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Intercepta las peticiones y las manda al index.php de Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Desactiva los logs para archivos que no importan 
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Conexión interna segura con el contenedor de aplicación PHP
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # BLOQUEO ESTRICTO: Deniega el acceso a cualquier archivo oculto (ej. .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}