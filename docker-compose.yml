version: '3.8'

services:
  # Servidor de Base de Datos Relacional (RI02)
  db:
    image: mariadb:10.11-jammy
    container_name: pos_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: pos_db
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
      MYSQL_ROOT_PASSWORD: root_secure_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - pos_network

  # Caché y Limitador de Peticiones (Rate Limiting)
  redis:
    image: redis:alpine
    container_name: pos_redis
    restart: always
    networks:
      - pos_network

  # Ecosistema de la Aplicación POS (RI01, RI03)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_laravel_app
    restart: always
    depends_on:
      - db
      - redis
    volumes:
      - ./:/var/www/html
    networks:
      - pos_network

  # Proxy Inverso y Seguridad Frontend (RNF01)
  nginx:
    image: nginx:alpine
    container_name: pos_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pos_network

networks:
  pos_network:
    driver: bridge

volumes:
  db_data: